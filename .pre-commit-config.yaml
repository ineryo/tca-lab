repos:
  - repo: local
    hooks:
      - id: black
        name: Black
        entry: uv run black
        language: system
        types: [python]

      - id: ruff
        name: Ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'

      - id: pytest-fast
        name: pytest fast
        entry: uv run pytest -q tests/python tests/integration
        language: system
        pass_filenames: false
        always_run: true